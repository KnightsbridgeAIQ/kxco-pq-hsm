name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege at the top level. Without this the workflow inherits the
# repository default, which may be read-write, and every job gets a token
# with more authority than it uses. Jobs that need more raise it themselves.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm

      - name: Install SoftHSM2
        run: |
          sudo apt-get install -y softhsm2
          mkdir -p /tmp/softhsm2-tokens
          echo "directories.tokendir = /tmp/softhsm2-tokens/" > /tmp/softhsm2.conf
          SOFTHSM2_CONF=/tmp/softhsm2.conf softhsm2-util --init-token --free --label "kxco-test" --pin 1234 --so-pin 0000

      - run: npm ci
      - run: npm test
        env:
          PKCS11_LIB: /usr/lib/x86_64-linux-gnu/softhsm/libsofthsm2.so
          PKCS11_PIN: "1234"
          PKCS11_SLOT: "0"
          SOFTHSM2_CONF: /tmp/softhsm2.conf
