name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or ref to publish (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write   # required for Trusted Publishing OIDC and --provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install SoftHSM2
        run: |
          sudo apt-get install -y softhsm2
          mkdir -p /tmp/softhsm2-tokens
          echo "directories.tokendir = /tmp/softhsm2-tokens/" > /tmp/softhsm2.conf
          SOFTHSM2_CONF=/tmp/softhsm2.conf softhsm2-util --init-token --free --label "kxco-test" --pin 1234 --so-pin 0000

      - name: Upgrade npm CLI to the 11.x line
        # Trusted Publishing's OIDC integration needs npm >= 11.5.1 and the npm
        # bundled with the runner's Node is older. Pinned to 11.x, never @latest:
        # npm 12 requires Node ^22.22 || ^24.15 || >=26, and @latest broke this
        # exact step in kxco-post-quantum, so an unpinned install is an outage.
        run: npm install -g npm@11

      - run: npm ci
      - run: npm test
        env:
          PKCS11_LIB: /usr/lib/x86_64-linux-gnu/softhsm/libsofthsm2.so
          PKCS11_PIN: "1234"
          PKCS11_SLOT: "0"
          SOFTHSM2_CONF: /tmp/softhsm2.conf

      - name: Publish
        run: npm publish --access public --provenance
