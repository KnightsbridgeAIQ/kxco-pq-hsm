name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or ref to publish (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install SoftHSM2
        run: |
          sudo apt-get install -y softhsm2
          mkdir -p /tmp/softhsm2-tokens
          echo "directories.tokendir = /tmp/softhsm2-tokens/" > /tmp/softhsm2.conf
          SOFTHSM2_CONF=/tmp/softhsm2.conf softhsm2-util --init-token --free --label "kxco-test" --pin 1234 --so-pin 0000

      - run: npm ci
      - run: npm test
        env:
          PKCS11_LIB: /usr/lib/x86_64-linux-gnu/softhsm/libsofthsm2.so
          PKCS11_PIN: "1234"
          PKCS11_SLOT: "0"
          SOFTHSM2_CONF: /tmp/softhsm2.conf

      - name: Publish
        run: npm publish --access public --no-provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
