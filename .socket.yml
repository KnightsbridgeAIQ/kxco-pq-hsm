version: 2

# https://docs.socket.dev/docs/socket-yml

issues:
  cve:
    action: error
  malware:
    action: error
  protestware:
    action: error
  new-author:
    action: warn
  install-scripts:
    action: warn
  telemetry:
    action: warn

# kxco-post-quantum — maintained by this organisation.
# @noble/* — Paul Miller's cryptography suite. hashes audited by Cure53 Jan 2022;
# curves by Trail of Bits, Kudelski and Cure53 across 2023-2024; ciphers by
# Cure53 Sep 2024. @noble/post-quantum has been audited by NOBODY: self-audited
# by its maintainer only.
# pkcs11js — optional peer dep for PKCS#11 hardware; review on upgrade.
ignore:
  - "kxco-post-quantum"
  - "@noble/post-quantum"
  - "@noble/hashes"
  - "@noble/ciphers"
  - "pkcs11js"
